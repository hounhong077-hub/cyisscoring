<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 📱 App Name on Home Screen -->
    <title>CYIS</title>
    <meta name="apple-mobile-web-app-title" content="CYIS">
    
    <!-- 🏫 Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    
    <!-- Full screen settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2c7da0">

    <style>
        /* Keep your loading screen CSS here */
        body { margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #ffffff; font-family: system-ui, sans-serif; }
        .logo { width: 120px; height: auto; margin-bottom: 20px; }
        .spinner { width: 30px; height: 30px; border: 4px solid #e2e8f0; border-top-color: #2c7da0; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #2c7da0; font-size: 1rem; font-weight: 700; }
    </style>
</head>
<body>
    <!-- Keep your body content here -->
    <img class="logo" src="icon.png" alt="CYIS Logo">
    <div class="spinner"></div>
    <div class="loading-text">Opening Web App...</div>

    <script>
        var appUrl = "https://script.google.com/macros/s/AKfycbyGE1k0CWBfOxEUeI6_aXyzDxlcCauIFrbT3s6MfQtrxh8JBZsRCa-NJFMkhBfM0FtO/exec";
        setTimeout(function() { window.location.replace(appUrl); }, 400);
    </script>
</body>
</html>
